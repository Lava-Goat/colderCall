services:
  coldercall:
    build: .
    user: "1000:1000"
    ports:
      - "127.0.0.1:16767:3000"
    volumes:
      - /home/jonerik/docker/coldercall/data:/app/data
    environment:
      PORT: 3000
      # Optional: needed only for Google Classroom import
      # GOOGLE_CLIENT_ID: your_client_id_here.apps.googleusercontent.com
    restart: unless-stopped
